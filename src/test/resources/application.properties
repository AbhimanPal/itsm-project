spring.application.name=itsm

# Tests use a throwaway in-memory database, so they never touch ./data
# and still work while the real app is running in IntelliJ.
spring.datasource.url=jdbc:h2:mem:testdb
spring.jpa.hibernate.ddl-auto=create-drop

# A mail host is needed for the email channel to start; there is no password, so tests never send email
spring.mail.host=localhost
