<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Green "done" message and red error message after a form is sent.
     Usage: <div th:replace="~{fragments/alerts :: alerts}"></div> -->
<div th:fragment="alerts">
    <p class="alert ok" th:if="${message}" th:text="${message}"></p>
    <p class="alert error" th:if="${error}" th:text="${error}"></p>
</div>
</body>
</html>
