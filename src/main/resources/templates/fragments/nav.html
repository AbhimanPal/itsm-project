<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Shared top bar. Usage: th:replace="~{fragments/nav :: nav('employee')}" -->
<header th:fragment="nav(role)" class="topbar">
    <span class="brand">I-ITSM</span>
    <span class="role-badge" th:text="${role}">role</span>
    <nav>
        <th:block th:if="${role == 'employee'}">
            <a th:href="@{/employee/incidents}">My incidents</a>
            <a th:href="@{/employee/incidents/new}">Report incident</a>
        </th:block>
        <th:block th:if="${role == 'technician'}">
            <a th:href="@{/technician}">My work</a>
        </th:block>
        <th:block th:if="${role == 'admin'}">
            <a th:href="@{/admin}">Dashboard</a>
            <a th:href="@{/admin/audit}">Audit log</a>
        </th:block>
        <a th:href="@{/notifications}">Notifications
            <span class="count" th:if="${unreadCount > 0}" th:text="${unreadCount}">2</span></a>
    </nav>
    <form th:action="@{/logout}" method="post" class="logout">
        <button type="submit">Log out</button>
    </form>
</header>
</body>
</html>
