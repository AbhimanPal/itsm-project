spring.application.name=itsm

# Save the database in a file (./data/itsm.mv.db) so data survives a restart
spring.datasource.url=jdbc:h2:file:./data/itsm
spring.datasource.username=sa
spring.datasource.password=

# Create/update tables from our @Entity classes automatically
spring.jpa.hibernate.ddl-auto=update

# Browse the database at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/itsm)
spring.h2.console.enabled=true

# Real email through Gmail (EmailNotificationChannel). The secrets come from environment
# variables, so they are never in GitHub. Without MAIL_PASSWORD, emails only go to the log.
#   MAIL_USERNAME    = the Gmail address that sends the emails
#   MAIL_PASSWORD    = a Gmail "app password" (16 letters), not the normal password
#   MAIL_REDIRECT_TO = optional: send every email to this one inbox (the demo accounts aren't real)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
itsm.mail.redirect-to=${MAIL_REDIRECT_TO:}
