spring.application.name=itsm

# Save the database in a file (./data/itsm.mv.db) so data survives a restart
spring.datasource.url=jdbc:h2:file:./data/itsm
spring.datasource.username=sa
spring.datasource.password=

# Create/update tables from our @Entity classes automatically
spring.jpa.hibernate.ddl-auto=update

# Browse the database at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/itsm)
spring.h2.console.enabled=true
